<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HamaB Store</title>
<meta name="theme-color" content="#ff6fa8">
<meta name="description" content="Chaveiros e estatuetas de Hama Beads. Transformando ideias em pixels!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Layout: loja kawaii mobile-first. Cabecalho fixo, conteudo em coluna unica no celular,
   barra de abas embaixo no celular e links no topo no computador. */
:root{
  --bg:#fff3f9; --surface:#ffffff; --surface2:#fff8fc; --ink:#4a2a45; --muted:#7d5a77;
  --line:#f2c3da; --dot:rgba(255,111,168,.20);
  --pink:#ff6fa8; --pink-d:#d9457f; --pink-soft:#ffd6e8; --on-pink:#3d1736; --title:#d13a78;
  --lilac:#c9b8ff; --lilac-soft:#ece6ff; --baby:#bfe4ff; --baby-soft:#e3f3ff;
  --wood1:#b86a26; --wood2:#e39a4a;
  --ok:#106b3b; --ok-bg:#d9f7e6; --warn:#8a4b00; --warn-bg:#ffefd2; --bad:#c2335a; --bad-d:#8f2243; --bad-bg:#ffe0e8;
  --wa:#12803f; --wa-d:#0b5a2b; --focus:#6a3df0; --shadow:rgba(120,50,100,.14);
  --header-bg:rgba(255,243,249,.88);
  --font-px:'Pixelify Sans',ui-monospace,Menlo,monospace;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-hand:'Gaegu','Nunito',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1223; --surface:#2a1a32; --surface2:#33203c; --ink:#ffe9f4; --muted:#d3b0c8;
    --line:#553566; --dot:rgba(255,111,168,.10);
    --pink-soft:#4f2745; --title:#ff8cbc; --lilac-soft:#2f2650; --baby-soft:#1f3047;
    --ok:#7ce8ad; --ok-bg:#173d2b; --warn:#ffc978; --warn-bg:#42301a; --bad:#ff7d9d; --bad-bg:#4a2030;
    --focus:#b9a2ff; --shadow:rgba(0,0,0,.4); --header-bg:rgba(29,18,35,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1223; --surface:#2a1a32; --surface2:#33203c; --ink:#ffe9f4; --muted:#d3b0c8;
  --line:#553566; --dot:rgba(255,111,168,.10);
  --pink-soft:#4f2745; --title:#ff8cbc; --lilac-soft:#2f2650; --baby-soft:#1f3047;
  --ok:#7ce8ad; --ok-bg:#173d2b; --warn:#ffc978; --warn-bg:#42301a; --bad:#ff7d9d; --bad-bg:#4a2030;
  --focus:#b9a2ff; --shadow:rgba(0,0,0,.4); --header-bg:rgba(29,18,35,.88);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:24px 24px;
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;min-height:100%}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* cabecalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:40px;height:40px}
.brand b{font:700 1.35rem var(--font-px);color:var(--title);text-shadow:2px 2px 0 var(--pink-soft);letter-spacing:.02em}
.nav{display:none;gap:6px}
.nav a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:800;font-size:.95rem;color:var(--muted)}
.nav a:hover{background:var(--pink-soft);color:var(--ink)}
.nav a[aria-current=page]{background:var(--pink);color:var(--on-pink)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;text-decoration:none;font:800 .72rem var(--font-body);color:var(--muted)}
.tabbar a[aria-current=page]{color:var(--title)}
.tabbar a[aria-current=page] .ic{filter:drop-shadow(0 2px 0 var(--pink-soft))}
@media (min-width:760px){.nav{display:flex}.tabbar{display:none}}

#banner{background:var(--warn-bg);color:var(--warn);font-size:.85rem;font-weight:700;padding:8px 0}
#banner .wrap{display:flex;gap:8px;align-items:flex-start}
main{padding-block:20px 110px}
@media (min-width:760px){main{padding-block:28px 56px}}

/* tipografia */
.h-px{font:700 clamp(1.6rem,6vw,2.4rem)/1.1 var(--font-px);color:var(--title);text-shadow:2px 2px 0 var(--pink-soft);text-wrap:balance}
.h2{font:700 1.2rem var(--font-px);color:var(--title);margin-bottom:10px}
.lead{color:var(--muted);font-weight:600;max-width:60ch;margin-top:6px}
.hand{font:700 1.05rem var(--font-hand);color:var(--muted)}
small,.small{font-size:.85rem;color:var(--muted)}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:0;border-radius:999px;
  font:800 .95rem var(--font-body);cursor:pointer;background:var(--pink);color:var(--on-pink);box-shadow:0 4px 0 var(--pink-d);
  text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn.wa{background:var(--wa);color:#fff;box-shadow:0 4px 0 var(--wa-d)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-d)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.85rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);cursor:pointer}
.iconbtn:hover{background:var(--pink-soft)}
.iconbtn[disabled]{opacity:.4;cursor:not-allowed}

/* formulario */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-weight:800;font-size:.9rem}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-weight:600}
textarea{resize:vertical;min-height:84px}
input[type=color]{padding:3px;min-height:46px;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pink-d)}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.form{display:grid;gap:14px}
.row2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:12px;font-weight:700}
.okmsg{background:var(--ok-bg);color:var(--ok);padding:12px 14px;border-radius:12px;font-weight:700}

/* paineis */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line)}
.stack{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-direction:column;align-items:center;min-height:44px;justify-content:center;padding:6px 16px;border-radius:16px;border:2px solid var(--line);
  background:var(--surface);font-weight:800;cursor:pointer;line-height:1.2}
.chip small{font-weight:700;font-size:.72rem}
.chip[aria-pressed=true]{background:var(--pink);border-color:var(--pink-d);color:var(--on-pink);box-shadow:0 3px 0 var(--pink-d)}
.chip[aria-pressed=true] small{color:var(--on-pink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 18px;display:grid;gap:14px;
  background:linear-gradient(135deg,var(--pink-soft),var(--lilac-soft) 60%,var(--baby-soft));border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.hero-fox{width:92px;height:auto;justify-self:start;filter:drop-shadow(0 4px 0 rgba(209,58,120,.25))}
.hero .deco{position:absolute;opacity:.85;width:22px;pointer-events:none}
.deco svg{display:block;width:100%;height:auto}
svg{max-width:100%}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:760px){.hero{grid-template-columns:auto 1fr;align-items:center;padding:28px 32px;gap:28px}.hero-fox{width:140px}}

/* produtos */
.toolbar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 14px}
.toolbar-row .search{flex:1 1 200px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;
  box-shadow:0 5px 0 var(--line),0 12px 22px var(--shadow);transition:transform .12s;text-align:left;padding:0}
.card:hover{transform:translateY(-3px) rotate(-.4deg)}
.card-img{display:block;position:relative;aspect-ratio:4/5;max-width:100%;background:repeating-linear-gradient(100deg,var(--wood1) 0 22px,var(--wood2) 22px 24px,var(--wood1) 24px 46px);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:#fff6ee;font:700 1.1rem var(--font-hand)}
.noimg svg{width:64px;height:auto}
.sticker{position:absolute;left:8px;top:8px;padding:2px 10px;border-radius:999px;background:var(--surface);color:var(--title);font:700 .95rem var(--font-hand);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.card-body{padding:12px 14px 14px;display:grid;gap:4px}
.pname,.price{display:block}
.pname{font:700 1.08rem/1.15 var(--font-px);color:var(--title)}
.price{font-weight:800;font-size:1.2rem}
.avail{font:700 .95rem var(--font-hand);color:var(--muted);display:flex;gap:6px;align-items:center}
.avail i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.avail.ok{color:var(--ok)}.avail.ok i{background:var(--ok)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-weight:700}
.empty svg{width:56px;height:auto;margin-bottom:8px}

/* editor */
.ed-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media (min-width:920px){.ed-grid{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}.ed-side{position:sticky;top:76px}}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tool{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:7px 8px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface2);cursor:pointer;font:800 .72rem var(--font-body)}
.tool[aria-pressed=true]{background:var(--pink);color:var(--on-pink);border-color:var(--pink-d);box-shadow:0 3px 0 var(--pink-d)}
.canvas-frame{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:6px}
.dim{display:flex;align-items:center;gap:8px;color:var(--muted);font:700 1rem var(--font-hand);min-width:0}
.dim i{flex:1;background:var(--pink);opacity:.7;border-radius:2px}
.dim-top{grid-column:2}
.dim-top i{height:2px}
.dim-left{grid-row:2;flex-direction:column}
.dim-left i{width:2px}
.dim-left span{writing-mode:vertical-rl;transform:rotate(180deg)}
.canvas-scroll{grid-column:2;grid-row:2;overflow:auto;max-width:100%;max-height:70vh;border-radius:10px}
#ed{display:block;margin:0 auto;touch-action:none;cursor:crosshair;border-radius:6px;background:#fff;box-shadow:0 0 0 3px var(--pink),0 6px 0 var(--pink-d)}
.under{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.under .grow{flex:1}
.zoomlbl{font-weight:800;min-width:48px;text-align:center}
.hint{margin-top:10px}
.h3{font:700 1rem var(--font-px);color:var(--title);margin:16px 0 8px}
.livebar{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--pink-soft);font-weight:800}
.livebar b{font:700 1.15rem var(--font-px);color:var(--title)}
.livebar .lp{margin-left:auto;font-size:1.3rem}
.summary{display:grid;gap:8px;background:linear-gradient(160deg,var(--surface),var(--pink-soft))}
.sum-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sum-row b{font-weight:800}
.sum-big{font:700 1.5rem var(--font-px);color:var(--title)}
.sum-price{font:800 2rem var(--font-body);color:var(--ink)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.sw{width:100%;aspect-ratio:1;min-width:34px;border-radius:12px;border:2px solid rgba(0,0,0,.18);background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
.used{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;max-height:190px;overflow:auto}
.used li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:4px;border-radius:10px;cursor:pointer;font-weight:700;text-align:left}
.used li button:hover{background:var(--pink-soft)}
.used .dot{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.2);flex:none}
.used .n{margin-left:auto;font-variant-numeric:tabular-nums}
.refbox{display:grid;gap:10px}
.refbox img{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--surface2);cursor:zoom-in}

/* modais e avisos */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(50,15,45,.55)}
.modal{background:var(--surface);color:var(--ink);border-radius:24px;border:2px solid var(--line);width:min(100%,520px);max-height:92vh;overflow:auto;padding:18px;box-shadow:0 8px 0 var(--line);display:grid;gap:14px}
.modal.wide{width:min(100%,720px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal img.big{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface2)}
.modal .card-img{border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);
  padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:800;box-shadow:0 6px 18px var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
@media (min-width:760px){.toast{bottom:28px}}

/* conta e admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:16px 0}
.tab{flex:none;min-height:42px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer}
.tab[aria-selected=true]{background:var(--pink);border-color:var(--pink-d);color:var(--on-pink)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:.78rem;background:var(--pink-soft);color:var(--title)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.list{display:grid;gap:12px}
.arow{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px 12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.arow .thumb{width:68px;height:84px;border-radius:12px;object-fit:cover;background:var(--wood1);overflow:hidden}
.arow .thumb svg{width:100%;height:100%}
.arow .info{min-width:0}
.arow .info b{display:block;overflow-wrap:anywhere}
.arow .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stock{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.stock span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.size-row{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));padding:12px;border:2px dashed var(--line);border-radius:16px;align-items:end}
.size-row .field:first-child{grid-column:1/-1}
@media (min-width:760px){.size-row{grid-template-columns:1.3fr .7fr .7fr .8fr 1fr auto}.size-row .field:first-child{grid-column:auto}}
.order-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.order-row img{width:96px;height:96px;object-fit:contain;border-radius:12px;background:var(--surface2);cursor:zoom-in}
.order-row .meta{display:grid;gap:4px;min-width:0;overflow-wrap:anywhere}
.order-row .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.auth{max-width:440px;margin:0 auto;display:grid;gap:14px}
.pwrow{position:relative}
.pwrow .iconbtn{position:absolute;right:4px;top:3px;border:0;background:none}
.pwrow input{padding-right:50px}
footer{border-top:2px solid var(--line);background:var(--surface);padding-block:22px 110px;color:var(--muted);font-weight:700}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
footer a{color:var(--title);text-decoration:none}
footer a:hover{text-decoration:underline}
@media (min-width:760px){footer{padding-bottom:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ============================================================

</script>

<script>
(function(){
'use strict';

/* ---------------- utilidades ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const brlTxt=n=>brl(n).replace(/ /g,' ');
const fmtCm=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=(v,d)=>{const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:(d||0)};
const int=(v,d)=>{const n=parseInt(v,10);return Number.isFinite(n)?n:(d||0)};
const round2=n=>Math.round(n*100)/100;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};

/* ---------------- pixel art da marca ---------------- */
const FOX_HALF=[
 '..dd....','.dood...','.dpood..','dpoooodd','dooooooo','dooooooo','dookwooo','dookkooo','dwoooooo','dwwwoooo','.dwwwwww','..dwwwwk','...ddwww','....dddd'
];
const FOX=FOX_HALF.map(r=>r+r.split('').reverse().join(''));
// laço rosa no lado direito da cabeça
(function(){const set=(y,x,c)=>{const a=FOX[y].split('');a[x]=c;FOX[y]=a.join('')};
 set(2,9,'p');set(2,11,'p');set(3,9,'p');set(3,10,'q');set(3,11,'p');set(4,9,'p');set(4,11,'p')})();
const FOX_PAL={d:'#d9691e',o:'#ff9a3c',w:'#fff4e6',k:'#3a2236',p:'#ff6fa8',q:'#d9457f'};
const HEART=['.xx..xx.','xxxxxxxx','xxxxxxxx','xxxxxxxx','.xxxxxx.','..xxxx..','...xx...'];
function pixelSVG(rows,pal,cls){
  const h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>{for(let x=0;x<row.length;x++){const c=pal[row[x]];if(c)r+='<rect x="'+x+'" y="'+y+'" width="1.03" height="1.03" fill="'+c+'"/>'}});
  return '<svg class="'+(cls||'')+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}
const foxSVG=cls=>pixelSVG(FOX,FOX_PAL,cls);
const heartSVG=(c,cls)=>pixelSVG(HEART,{x:c},cls);

/* ---------------- imagens ---------------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Não consegui abrir essa imagem.'));
  i.src=(typeof Blob!=='undefined'&&src instanceof Blob)?URL.createObjectURL(src):src})}
async function resizeToBlob(file,max,type,q){
  max=max||900;type=type||'image/jpeg';q=q||.86;
  const img=await loadImg(file);const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,type,q));
  if(file instanceof Blob)URL.revokeObjectURL(img.src);
  if(!blob)throw new Error('Não consegui processar essa imagem.');
  return {blob,w,h};
}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Falha ao ler a imagem.'));r.readAsDataURL(b)});
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept||'image/*';i.onchange=()=>res(i.files&&i.files[0]||null);i.click()})}

/* ---------------- telefone ---------------- */
function normPhone(v){const d=String(v||'').replace(/\D/g,'');if(d.length===10||d.length===11)return '55'+d;if((d.length===12||d.length===13)&&d.startsWith('55'))return d;return d.length>=10&&d.length<=15?d:''}
function fmtPhone(d){if(d.startsWith('55')&&d.length===13)return '+55 '+d.slice(2,4)+' '+d.slice(4,9)+'-'+d.slice(9);
  if(d.startsWith('55')&&d.length===12)return '+55 '+d.slice(2,4)+' '+d.slice(4,8)+'-'+d.slice(8);return '+'+d}

/* ---------------- backend local (modo demonstração) ---------------- */
function makeLocalApi(){
  const K={users:'hamab_users_v1',sess:'hamab_sess_v1',prod:'hamab_prod_v1',set:'hamab_set_v1',ord:'hamab_ord_v1'};
  const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hamab:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+s}};
  const users=async()=>{let u=store.get(K.users,null);if(!u){u=[{id:'u-admin',email:'admin@hamab.demo',nome:'Admin de teste',papel:'admin',h:await sha('admin123')}];store.set(K.users,u)}return u};
  const pub=u=>u?{id:u.id,email:u.email,nome:u.nome,papel:u.papel}:null;
  const api={
    demo:true,
    async getSettings(){return store.get(K.set,null)},
    async saveSettings(s){store.set(K.set,s)},
    async getProducts(){let p=store.get(K.prod,null);if(!p){p=SEED_PRODUCTS.map((s,i)=>({id:'p'+(i+1),nome:s.nome,tipo:s.tipo,material:s.material,descricao:s.descricao,preco:s.preco,estoque:s.estoque,foto_url:SEED_IMG[s.k]||null,ativo:true}));store.set(K.prod,p)}return p},
    async saveProduct(p){const list=await api.getProducts();let row;
      if(p.id){const i=list.findIndex(x=>x.id===p.id);row=Object.assign({},list[i],p);list[i]=row}else{row=Object.assign({},p,{id:uid()});list.push(row)}
      if(!store.set(K.prod,list))throw new Error('Sem espaço para salvar (a foto pode estar muito grande).');return row},
    async deleteProduct(id){store.set(K.prod,(await api.getProducts()).filter(x=>x.id!==id))},
    async uploadImage(blob){return blobToDataURL(blob)},
    async getUser(){const sid=store.get(K.sess,null);if(!sid)return null;return pub((await users()).find(x=>x.id===sid))},
    async signUp(email,senha,nome){const us=await users();if(us.some(x=>x.email===email))throw new Error('already registered');
      const u={id:uid(),email,nome,papel:'cliente',h:await sha(senha)};us.push(u);store.set(K.users,us);store.set(K.sess,u.id);return {needsConfirm:false}},
    async signIn(email,senha){const u=(await users()).find(x=>x.email===email);if(!u||u.h!==await sha(senha))throw new Error('Invalid login credentials');store.set(K.sess,u.id)},
    async signOut(){store.set(K.sess,null)},
    async resetPassword(){},
    async updatePassword(){},
    async createOrder(o){const l=store.get(K.ord,[]);l.unshift(Object.assign({id:uid(),status:'novo',criado_em:new Date().toISOString()},o));
      if(!store.set(K.ord,l.slice(0,60)))throw new Error('Sem espaço para salvar o pedido neste aparelho.')},
    async listMyOrders(id){return store.get(K.ord,[]).filter(o=>o.user_id===id)},
    async listAllOrders(){return store.get(K.ord,[])},
    async setOrderStatus(id,status){const l=store.get(K.ord,[]);const o=l.find(x=>x.id===id);if(o)o.status=status;store.set(K.ord,l)}
  };
  return api;
}

/* ---------------- backend real (Supabase) ---------------- */
function makeLiveApi(sb){
  const t=r=>{if(r.error)throw r.error;return r.data};
  const ext=b=>({'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[b.type]||'png');
  const back=()=>location.origin+location.pathname;
  return {
    demo:false,
    async getSettings(){const d=t(await sb.from('configuracoes').select('dados').eq('id',1).maybeSingle());return d?d.dados:null},
    async saveSettings(s){t(await sb.from('configuracoes').upsert({id:1,dados:s,atualizado_em:new Date().toISOString()}))},
    async getProducts(){return t(await sb.from('produtos').select('*').order('criado_em',{ascending:true}))},
    async saveProduct(p){const row={nome:p.nome,tipo:p.tipo,material:p.material,descricao:p.descricao,preco:p.preco,estoque:p.estoque,foto_url:p.foto_url||null,ativo:p.ativo!==false};
      if(p.id)return t(await sb.from('produtos').update(row).eq('id',p.id).select().single());
      return t(await sb.from('produtos').insert(row).select().single())},
    async deleteProduct(id){t(await sb.from('produtos').delete().eq('id',id))},
    async uploadImage(blob,bucket){const s=(await sb.auth.getSession()).data.session;
      const folder=bucket==='pedidos'?((s?s.user.id:'anon')+'/'):'admin/';const path=folder+uid()+'.'+ext(blob);
      const r=await sb.storage.from(bucket).upload(path,blob,{contentType:blob.type,cacheControl:'31536000'});if(r.error)throw r.error;
      return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl},
    async getUser(){const s=(await sb.auth.getSession()).data.session;if(!s)return null;const u=s.user;
      let papel='cliente',nome=(u.user_metadata&&u.user_metadata.nome)||'';
      const r=await sb.from('perfis').select('papel,nome').eq('id',u.id).maybeSingle();
      if(r.data){papel=r.data.papel;nome=r.data.nome||nome}
      return {id:u.id,email:u.email,nome,papel}},
    async signUp(email,senha,nome){const r=await sb.auth.signUp({email,password:senha,options:{data:{nome},emailRedirectTo:back()}});if(r.error)throw r.error;
      if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)throw new Error('already registered');
      return {needsConfirm:!r.data.session}},
    async signIn(email,senha){const r=await sb.auth.signInWithPassword({email,password:senha});if(r.error)throw r.error},
    async signOut(){await sb.auth.signOut()},
    async resetPassword(email){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:back()});if(r.error)throw r.error},
    async updatePassword(p){const r=await sb.auth.updateUser({password:p});if(r.error)throw r.error},
    async createOrder(o){t(await sb.from('pedidos').insert(o))},
    async listMyOrders(id){return t(await sb.from('pedidos').select('*').eq('user_id',id).order('criado_em',{ascending:false}).limit(100))},
    async listAllOrders(){return t(await sb.from('pedidos').select('*').order('criado_em',{ascending:false}).limit(200))},
    async setOrderStatus(id,status){t(await sb.from('pedidos').update({status}).eq('id',id))}
  };
}

  clearTimeout(toastT);toastT=setTimeout(()=>{h.innerHTML=''},kind==='err'?5200:2800)}
function openModal(html,wide){const o=$('#overlay');o.hidden=false;o.className='overlay';
  o.innerHTML='<div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  const f=$('input,textarea,select,button,a',o);if(f&&!/pointer/.test(f.type||''))setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},30)}
function closeModal(){const o=$('#overlay');if(o){o.hidden=true;o.innerHTML=''}S.pend=null}

function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.l=btn.innerHTML;btn.disabled=true;btn.innerHTML=esc(label||'Aguarde...')}else{btn.disabled=false;if(btn.dataset.l)btn.innerHTML=btn.dataset.l}}
function confirmTwice(el,fn,label){
  if(el.dataset.armed){clearTimeout(+el.dataset.armed);delete el.dataset.armed;el.innerHTML=el.dataset.orig;el.classList.remove('danger');fn();return}
  el.dataset.orig=el.innerHTML;el.classList.add('danger');el.innerHTML=esc(label||'Confirmar?');
  el.dataset.armed=String(setTimeout(()=>{delete el.dataset.armed;el.innerHTML=el.dataset.orig;el.classList.remove('danger')},3200));
}
function errMsg(e){
  const m=(e&&e.message)||String(e||'');
  const map=[[/invalid login/i,'E-mail ou senha incorretos.'],[/not confirmed/i,'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).'],
   [/already registered|already been registered/i,'Este e-mail já tem cadastro. Tente entrar.'],[/password should|at least|weak/i,'A senha precisa ter pelo menos 8 caracteres.'],
   [/rate limit|too many|security purposes/i,'Muitas tentativas. Espere alguns minutos e tente de novo.'],
   [/row-level security|permission denied|not allowed|violates/i,'Você não tem permissão para fazer isso.'],
   [/failed to fetch|networkerror|load failed/i,'Sem conexão com a internet. Tente de novo.'],[/same password/i,'Escolha uma senha diferente da atual.']];
  for(const [r,t] of map)if(r.test(m))return t;return m||'Algo deu errado. Tente de novo.';
}

/* ---------------- editor de pixel ---------------- */
const ED={inited:false,w:12,h:12,sizeId:'t12',cells:[],tool:'pencil',color:'#f0509b',mirror:false,grid:true,zoom:1,undo:[],redo:[],cs:20,dpr:1,
  canvas:null,ref:null,drawing:false,last:null,changed:false,obs:'',name:'',pan:null};
function initEditor(){
  const T=S.settings.tamanhos;
  ED.sizeId=T[0].id;ED.w=T[0].w;ED.h=T[0].h;ED.cells=new Array(ED.w*ED.h).fill(null);ED.undo=[];ED.redo=[];
  const d=store.get('hamab_draft_v1',null);
  if(d&&Array.isArray(d.cells)&&d.w>0&&d.h>0&&d.w<=100&&d.h<=100&&d.cells.length===d.w*d.h){
    const ok=d.sizeId==='custom'||T.some(t=>t.id===d.sizeId&&t.w===d.w&&t.h===d.h);
    if(ok){ED.sizeId=d.sizeId;ED.w=d.w;ED.h=d.h;ED.cells=d.cells.map(c=>(typeof c==='string'&&HEX.test(c))?c.toLowerCase():null)}
    ED.obs=String(d.obs||'').slice(0,300);ED.name=String(d.name||'').slice(0,60);
    if(HEX.test(d.color||''))ED.color=d.color;
  }
  ED.inited=true;
}
let draftT=null;
function saveDraft(){clearTimeout(draftT);draftT=setTimeout(()=>{store.set('hamab_draft_v1',{w:ED.w,h:ED.h,sizeId:ED.sizeId,cells:ED.cells,obs:ED.obs,name:ED.name,color:ED.color})},400)}
const snap=()=>({w:ED.w,h:ED.h,sizeId:ED.sizeId,cells:ED.cells.slice()});
function restore(s){ED.w=s.w;ED.h=s.h;ED.sizeId=s.sizeId;ED.cells=s.cells.slice()}
function pushUndo(s){ED.undo.push(s||snap());if(ED.undo.length>120)ED.undo.shift();ED.redo=[]}
function currentSize(){
  const S2=S.settings;
  if(ED.sizeId==='custom')return {id:'custom',rotulo:'Personalizado',w:ED.w,h:ED.h,custom:true,preco:0,medida:''};
  const t=S2.tamanhos.find(x=>x.id===ED.sizeId)||S2.tamanhos[0];return Object.assign({custom:false},t);
}
function cmText(sz){
  if(!sz.custom&&sz.medida){const m=String(sz.medida).trim();return /cm/i.test(m)?m:m+' cm'}
  const mm=S.settings.mm_conta;return fmtCm(sz.w*mm/10)+' × '+fmtCm(sz.h*mm/10)+' cm';
}
const countBeads=()=>ED.cells.reduce((n,c)=>n+(c?1:0),0);
function usedColors(){const m=new Map();ED.cells.forEach(c=>{if(c)m.set(c,(m.get(c)||0)+1)});return Array.from(m.entries()).sort((a,b)=>b[1]-a[1])}
function calcPrice(){
  const s=S.settings,sz=currentSize(),beads=countBeads(),colors=usedColors().length;
  if(!beads)return 0;
  const base=sz.custom?(num(s.custom.base)+beads*num(s.custom.por_conta)):num(sz.preco);
  const extra=Math.max(0,colors-int(s.cores_inclusas,5))*num(s.preco_cor_extra);
  return round2(base+extra);
}
function setSize(id,w,h){
  const s=S.settings;let nw,nh;
  if(id==='custom'){nw=clamp(int(w,ED.w),s.custom.min,s.custom.max);nh=clamp(int(h,ED.h),s.custom.min,s.custom.max)}
  else{const t=s.tamanhos.find(x=>x.id===id);if(!t)return;nw=t.w;nh=t.h}
  if(id===ED.sizeId&&nw===ED.w&&nh===ED.h){updateEditorUI();return}
  pushUndo();
  const n=new Array(nw*nh).fill(null);
  for(let y=0;y<Math.min(ED.h,nh);y++)for(let x=0;x<Math.min(ED.w,nw);x++)n[y*nw+x]=ED.cells[y*ED.w+x];
  ED.w=nw;ED.h=nh;ED.cells=n;ED.sizeId=id;
  layoutCanvas();draw();updateEditorUI();saveDraft();
}
function layoutCanvas(){
  const sc=$('#canvasScroll'),c=ED.canvas;if(!sc||!c)return;
  const avail=Math.max(160,sc.clientWidth||300);
  const base=Math.max(6,Math.min(Math.floor(avail/ED.w),Math.floor(560/ED.h),40));
  const cs=Math.max(4,Math.floor(base*ED.zoom));
  ED.cs=cs;ED.dpr=Math.min(window.devicePixelRatio||1,3);
  c.width=ED.w*cs*ED.dpr;c.height=ED.h*cs*ED.dpr;c.style.width=ED.w*cs+'px';c.style.height=ED.h*cs+'px';
}
function draw(){
  const c=ED.canvas;if(!c)return;const g=c.getContext('2d');if(!g)return;
  const cs=ED.cs,w=ED.w,h=ED.h;g.setTransform(ED.dpr,0,0,ED.dpr,0,0);g.clearRect(0,0,w*cs,h*cs);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    g.fillStyle=((x+y)&1)?'#ffffff':'#fcecf5';g.fillRect(x*cs,y*cs,cs,cs);
    const col=ED.cells[y*w+x];
    if(col){g.fillStyle=col;g.fillRect(x*cs,y*cs,cs,cs);
      if(cs>=14){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.arc(x*cs+cs/2,y*cs+cs/2,cs*.12,0,Math.PI*2);g.fill()}}
  }
  if(ED.grid){g.lineWidth=1;
    for(let i=0;i<=w;i++){g.strokeStyle=(i%5===0)?'rgba(74,42,69,.38)':'rgba(74,42,69,.13)';g.beginPath();g.moveTo(i*cs+.5,0);g.lineTo(i*cs+.5,h*cs);g.stroke()}
    for(let j=0;j<=h;j++){g.strokeStyle=(j%5===0)?'rgba(74,42,69,.38)':'rgba(74,42,69,.13)';g.beginPath();g.moveTo(0,j*cs+.5);g.lineTo(w*cs,j*cs+.5);g.stroke()}}
  if(ED.mirror){g.save();g.setLineDash([6,4]);g.strokeStyle='#6a3df0';g.lineWidth=2;g.beginPath();g.moveTo(w*cs/2,0);g.lineTo(w*cs/2,h*cs);g.stroke();g.restore()}
}
function cellAt(e){
  const r=ED.canvas.getBoundingClientRect();if(!r.width||!r.height)return null;
  const x=Math.floor((e.clientX-r.left)/r.width*ED.w),y=Math.floor((e.clientY-r.top)/r.height*ED.h);
  return (x<0||y<0||x>=ED.w||y>=ED.h)?null:{x,y};
}
function setCell(x,y,col){
  const i=y*ED.w+x;if(ED.cells[i]!==col){ED.cells[i]=col;ED.changed=true}
  if(ED.mirror){const mx=ED.w-1-x,j=y*ED.w+mx;if(ED.cells[j]!==col){ED.cells[j]=col;ED.changed=true}}
}
function line(a,b,fn){
  let x0=a.x,y0=a.y;const x1=b.x,y1=b.y,dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy;
  for(;;){fn(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}
}
function floodFill(x,y,col){
  const w=ED.w,h=ED.h,t=ED.cells[y*w+x];if(t===col)return;
  const st=[[x,y]];
  while(st.length){const [cx,cy]=st.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;const i=cy*w+cx;if(ED.cells[i]!==t)continue;
    ED.cells[i]=col;ED.changed=true;st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}
}
function applyTool(p){
  if(ED.tool==='pencil')setCell(p.x,p.y,ED.color);
  else if(ED.tool==='eraser')setCell(p.x,p.y,null);
  else if(ED.tool==='fill')floodFill(p.x,p.y,ED.color);
  else if(ED.tool==='picker'){const c=ED.cells[p.y*ED.w+p.x];if(c){ED.color=c;ED.tool='pencil'}updateEditorUI()}
}
function bindCanvas(){
  const c=ED.canvas;
  c.addEventListener('pointerdown',e=>{
    e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}
    if(ED.tool==='pan'){ED.pan={x:e.clientX,y:e.clientY};return}
    const p=cellAt(e);if(!p)return;
    ED.drawing=true;ED.last=p;ED.changed=false;ED.before=snap();applyTool(p);draw();
  });
  c.addEventListener('pointermove',e=>{
    if(ED.pan){const sc=$('#canvasScroll');sc.scrollLeft-=e.clientX-ED.pan.x;sc.scrollTop-=e.clientY-ED.pan.y;ED.pan={x:e.clientX,y:e.clientY};return}
    if(!ED.drawing||(ED.tool!=='pencil'&&ED.tool!=='eraser'))return;
    const p=cellAt(e);if(!p){ED.last=null;return}
    if(ED.last&&(p.x!==ED.last.x||p.y!==ED.last.y)){const col=ED.tool==='pencil'?ED.color:null;line(ED.last,p,(x,y)=>setCell(x,y,col));draw()}
    else if(!ED.last){applyTool(p);draw()}
    ED.last=p;
  });
  const end=()=>{
    if(ED.pan){ED.pan=null;return}
    if(!ED.drawing)return;ED.drawing=false;ED.last=null;
    if(ED.changed){pushUndo(ED.before);updateEditorUI();saveDraft()}
  };
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  c.addEventListener('contextmenu',e=>e.preventDefault());
}
function undo(){if(!ED.undo.length)return;ED.redo.push(snap());restore(ED.undo.pop());layoutCanvas();draw();updateEditorUI();saveDraft()}
function redo(){if(!ED.redo.length)return;ED.undo.push(snap());restore(ED.redo.pop());layoutCanvas();draw();updateEditorUI();saveDraft()}

async function pixelizeRef(){
  if(!ED.ref)return;
  try{
    const img=await loadImg(ED.ref.url);
    const skip=!$('#refWhite')||$('#refWhite').checked;
    const w=ED.w,h=ED.h;const sr=img.naturalWidth/img.naturalHeight,tr=w/h;
    let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
    if(sr>tr){sw=sh*tr;sx=(img.naturalWidth-sw)/2}else{sh=sw/tr;sy=(img.naturalHeight-sh)/2}
    let cw=Math.min(512,Math.max(w,Math.round(sw))),ch=Math.max(h,Math.round(cw/tr));
    let cur=document.createElement('canvas');cur.width=cw;cur.height=ch;cur.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cw,ch);
    while(cur.width>w*2&&cur.height>h*2){const n=document.createElement('canvas');n.width=Math.max(w,Math.floor(cur.width/2));n.height=Math.max(h,Math.floor(cur.height/2));
      const g=n.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cur,0,0,n.width,n.height);cur=n}
    const f=document.createElement('canvas');f.width=w;f.height=h;const g=f.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';g.drawImage(cur,0,0,w,h);
    const d=g.getImageData(0,0,w,h).data;const out=[];
    for(let i=0;i<w*h;i++){const r=d[i*4],gg=d[i*4+1],b=d[i*4+2],a=d[i*4+3];
      out.push((a<110||(skip&&r>232&&gg>232&&b>232))?null:nearest(r,gg,b))}
    pushUndo();ED.cells=out;draw();updateEditorUI();saveDraft();toast('Pronto! Agora é só retocar os quadradinhos.');
  }catch(e){toast(errMsg(e),'err')}
}
async function renderPNG(){
  if(document.fonts&&document.fonts.ready)try{await document.fonts.ready}catch(e){}
  const sc=24,pad=24,w=ED.w,h=ED.h,foot=64;
  const c=document.createElement('canvas');c.width=w*sc+pad*2;c.height=h*sc+pad*2+foot;const g=c.getContext('2d');
  g.fillStyle='#fff7fb';g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#f6cfe0';
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){g.beginPath();g.arc(pad+x*sc+sc/2,pad+y*sc+sc/2,2,0,Math.PI*2);g.fill()}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const col=ED.cells[y*w+x];if(!col)continue;
    const cx=pad+x*sc+sc/2,cy=pad+y*sc+sc/2;
    g.fillStyle=col;g.beginPath();g.arc(cx,cy,sc*.47,0,Math.PI*2);g.fill();
    g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=1.5;g.stroke();
    g.fillStyle='#fff7fb';g.beginPath();g.arc(cx,cy,sc*.15,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(cx-sc*.2,cy-sc*.2,sc*.08,0,Math.PI*2);g.fill()}
  const sz=currentSize();
  g.fillStyle='#d13a78';g.font='700 22px "Pixelify Sans",monospace';g.textBaseline='middle';
  g.fillText('HamaB Store',pad,h*sc+pad*2+foot/2-10);
  g.fillStyle='#4a2a45';g.font='700 17px Nunito,sans-serif';
  g.fillText(sz.rotulo+' · '+cmText(sz)+' · '+countBeads()+' miçangas',pad,h*sc+pad*2+foot/2+16);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(!blob)throw new Error('Não consegui gerar a imagem do desenho.');
  return {blob,url:URL.createObjectURL(blob)};
}
function orderMessage(name,drawUrl,refUrl,obs){
  const sz=currentSize(),used=usedColors();
  const L=['Olá! Quero encomendar um chaveiro personalizado 💗','','Nome: '+name,'Tamanho: '+sz.rotulo+' ('+cmText(sz)+')',
    'Miçangas: '+countBeads()+' · Cores: '+used.length,'Preço estimado: '+brlTxt(calcPrice()),'Observações: '+(obs||'—'),''];
  L.push(drawUrl?'Desenho: '+drawUrl:'Desenho: vou enviar a imagem em seguida.');
  if(refUrl)L.push('Foto de referência: '+refUrl);
  return L.join('\n');
}
async function sendOrder(btn){
  if(!countBeads()){toast('Pinte pelo menos um quadradinho antes de enviar.','err');return}
  const name=$('#oName').value.trim();
  if(!name){$('#oName').focus();toast('Escreva seu nome para a vendedora saber quem é.','err');return}
  if(!S.user){S.afterLogin='#/criar';toast('Entre na sua conta para enviar o pedido. Seu desenho fica salvo.');go('#/entrar');return}
  const win=window.open('about:blank','_blank');
  busy(btn,true,'Salvando pedido...');
  try{
    const obs=$('#oObs').value.trim();const sz=currentSize();
    const png=await renderPNG();S.lastPng=png;
    const drawUrl=await S.api.uploadImage(png.blob,'pedidos');
    let refUrl=null;
    if(ED.ref&&$('#refSend')&&$('#refSend').checked)refUrl=await S.api.uploadImage(ED.ref.blob,'pedidos');
    await S.api.createOrder({nome_cliente:name,email_cliente:S.user.email,tamanho:sz.rotulo,largura:ED.w,altura:ED.h,medida_cm:cmText(sz),
      qtd_contas:countBeads(),qtd_cores:usedColors().length,preco:calcPrice(),observacoes:obs,desenho_url:drawUrl,referencia_url:refUrl,user_id:S.user.id});
    const live=!S.demo;
    const link=waLink(orderMessage(name,live?drawUrl:null,live?refUrl:null,obs));
    if(win)win.location.href=link;
    showOrderDone(link,png.url);
  }catch(e){if(win)try{win.close()}catch(x){}toast(errMsg(e),'err')}
  finally{busy(btn,false)}
}
function showOrderDone(link,pngUrl){
  const canShare=!!(navigator.canShare&&typeof File!=='undefined'&&navigator.canShare({files:[new File([S.lastPng.blob],'x.png',{type:'image/png'})]}));
  openModal(modalHead('Pedido salvo!')+'<img class="big" src="'+esc(pngUrl)+'" alt="Seu desenho">'
   +'<p>'+(S.demo?'Modo demonstração: o desenho não vai como link. Baixe a imagem e anexe na conversa.':'O WhatsApp da loja deve abrir com a mensagem pronta. Se não abriu, use o botão verde.')+'</p>'
   +'<a class="btn wa block" href="'+esc(link)+'" target="_blank" rel="noopener">'+ic('wa')+'Abrir WhatsApp</a>'
   +(canShare?'<button class="btn block" type="button" data-act="share-png">'+ic('share')+'Enviar a imagem pelo WhatsApp</button>':'')
   +'<a class="btn ghost block" href="'+esc(pngUrl)+'" download="meu-chaveiro-hamab.png">'+ic('dl')+'Baixar desenho (PNG)</a>');
}

function readSettings(f){
  const rows=$$('.size-row',f).map((r,i)=>{const g=n=>$('[name='+n+']',r).value;
    const w=clamp(int(g('w'),10),1,100),h=clamp(int(g('h'),10),1,100);
    return {id:r.dataset.id||('t'+Date.now().toString(36)+i),rotulo:g('rotulo').trim()||(w+'×'+h),w,h,preco:Math.max(0,num(g('preco'))),medida:g('medida').trim()}});
  const q=n=>f.elements[n].value;
  const cmin=clamp(int(q('cmin'),5),1,100),cmax=clamp(int(q('cmax'),40),cmin,100);
  return {whatsapp:normPhone(q('whatsapp')),mm_conta:clamp(num(q('mm'),5),1,20),tamanhos:rows,
    custom:{min:cmin,max:cmax,base:Math.max(0,num(q('cbase'))),por_conta:Math.max(0,num(q('cper')))},
    cores_inclusas:clamp(int(q('cinc'),5),1,30),preco_cor_extra:Math.max(0,num(q('cextra')))};
}

 'pick-photo':async()=>{const f=await pickFile('image/*');if(!f)return;
   try{const r=await resizeToBlob(f,900,'image/jpeg',.85);const url=URL.createObjectURL(r.blob);S.pend=S.pend||{};S.pend.photo=r.blob;$('#pPrev').innerHTML='<img src="'+url+'" alt="Nova foto">'}catch(e){toast(errMsg(e),'err')}},
 'del-product':el=>confirmTwice(el,async()=>{try{await S.api.deleteProduct(el.dataset.id);S.products=S.products.filter(p=>p.id!==el.dataset.id);adminBody();toast('Produto excluído.')}catch(e){toast(errMsg(e),'err')}},'Excluir mesmo?'),
 'stock':async el=>{const p=S.products.find(x=>x.id===el.dataset.id);if(!p)return;const n=Math.max(0,p.estoque+int(el.dataset.d));if(n===p.estoque)return;
   try{const r=await S.api.saveProduct(Object.assign({},p,{estoque:n}));Object.assign(p,r);adminBody()}catch(e){toast(errMsg(e),'err')}},
 'photo':async el=>{const p=S.products.find(x=>x.id===el.dataset.id);if(!p)return;const f=await pickFile('image/*');if(!f)return;
   try{toast('Enviando foto...');const r=await resizeToBlob(f,900,'image/jpeg',.85);const url=await S.api.uploadImage(r.blob,'produtos');
     const row=await S.api.saveProduct(Object.assign({},p,{foto_url:url}));Object.assign(p,row);adminBody();toast('Foto trocada!')}catch(e){toast(errMsg(e),'err')}},
 'add-size':()=>{const box=$('#sizeRows');const tmp=document.createElement('div');tmp.innerHTML=sizeRowHTML({id:'t'+Date.now().toString(36),rotulo:'20×20',w:20,h:20,preco:25,medida:''});box.appendChild(tmp.firstChild)},
 'rm-size':el=>{const rows=$$('.size-row');if(rows.length<=1){toast('Mantenha pelo menos um tamanho.','err');return}el.closest('.size-row').remove()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='overlay'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeModal()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;$('#grid').innerHTML=gridHTML()}
  else if(t.id==='oName'){ED.name=t.value;saveDraft()}
  else if(t.id==='oObs'){ED.obs=t.value;saveDraft()}
  else if(t.id==='freeColor'){ED.color=t.value.toLowerCase();if(ED.tool==='eraser'||ED.tool==='picker'||ED.tool==='pan')ED.tool='pencil';updateEditorUI();saveDraft()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='cw'||t.id==='ch'){setSize('custom',$('#cw').value,$('#ch').value);$('#cw').value=ED.w;$('#ch').value=ED.h}
  else if(t.dataset.chg==='order-status'){try{await S.api.setOrderStatus(t.dataset.id,t.value);toast('Status atualizado.')}catch(x){toast(errMsg(x),'err')}}
});
let rzT=null;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.route==='/criar'&&ED.canvas&&document.body.contains(ED.canvas)){layoutCanvas();draw()}},120)});

/* ---------------- formulários ---------------- */
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form,btn=$('button[type=submit]',f),msg=$('#authMsg');
  const say=(t,ok)=>{const m=$('#authMsg')||$('#cfgMsg')||$('#pErr');if(m)m.innerHTML='<div class="'+(ok?'okmsg':'err')+'" role="alert">'+esc(t)+'</div>'};
  try{
    if(kind==='login'||kind==='signup'){
      const email=f.elements.email.value.trim().toLowerCase(),senha=f.elements.senha.value;
      if(senha.length<8)return say('A senha precisa ter pelo menos 8 caracteres.');
      busy(btn,true,kind==='login'?'Entrando...':'Criando conta...');
      try{
        if(kind==='signup'){const r=await S.api.signUp(email,senha,f.elements.nome.value.trim());
          if(r.needsConfirm){say('Quase lá! Enviamos um link de confirmação para '+email+'. Abra o e-mail, confirme e depois entre aqui. Veja também o spam.',true);return}}
        else await S.api.signIn(email,senha);
        await refreshUser();toast(kind==='login'?'Bem-vinda de volta!':'Conta criada!');
        const dest=S.afterLogin||(S.user&&S.user.papel==='admin'&&kind==='login'?'#/admin':'#/');S.afterLogin=null;go(dest);
      }finally{busy(btn,false)}
    }else if(kind==='forgot'){
      busy(btn,true,'Enviando...');try{await S.api.resetPassword(f.elements.email.value.trim().toLowerCase());say('Se este e-mail tiver cadastro, o link já está a caminho.',true)}finally{busy(btn,false)}
    }else if(kind==='newpass'){
      busy(btn,true,'Salvando...');try{await S.api.updatePassword(f.elements.senha.value);S.recovery=false;await refreshUser();toast('Senha atualizada!');go('#/')}finally{busy(btn,false)}
    }else if(kind==='product'){
      busy(btn,true,'Salvando...');
      try{
        const id=f.dataset.id||null,old=id?S.products.find(p=>p.id===id):null;let foto=old?old.foto_url:null;
        if(S.pend&&S.pend.photo)foto=await S.api.uploadImage(S.pend.photo,'produtos');
        const row=await S.api.saveProduct({id:id||undefined,nome:f.elements.nome.value.trim(),tipo:f.elements.tipo.value,material:f.elements.material.value.trim(),
          descricao:f.elements.descricao.value.trim(),preco:Math.max(0,num(f.elements.preco.value)),estoque:Math.max(0,int(f.elements.estoque.value)),foto_url:foto,ativo:f.elements.ativo.checked});
        if(old)Object.assign(old,row);else S.products.push(row);
        closeModal();adminBody();toast('Produto salvo!');
      }finally{busy(btn,false)}
    }else if(kind==='settings'){
      const s=readSettings(f);if(!s.whatsapp)return say('Confira o número do WhatsApp. Use DDD + número.');
      busy(btn,true,'Salvando...');
      try{await S.api.saveSettings(s);S.settings=mergeSettings(s);ED.inited=false;setFoot();say('Configurações salvas!',true);setTimeout(()=>{const m=$('#cfgMsg');if(m)m.innerHTML=''},2500)}finally{busy(btn,false)}
    }
  }catch(err){say(errMsg(err))}
});

/* ---------------- rotas ---------------- */
let lastRoute=null;
function render(){
  const raw=location.hash.startsWith('#/')?location.hash.slice(1):'/';
  const r=raw.split('?')[0]||'/';const app=$('#app');
  closeModal();
  if(S.fatal){app.innerHTML='<div class="err">'+esc(S.fatal)+'</div><p style="margin-top:12px"><button class="btn" type="button" onclick="location.reload()">Tentar de novo</button></p>';return}
  if(r==='/conta'&&!S.user){S.afterLogin='#/conta';go('#/entrar');return}
  if(r==='/admin'&&!(S.user&&S.user.papel==='admin')){S.afterLogin=S.user?null:'#/admin';go(S.user?'#/':'#/entrar');return}
  if(r==='/entrar'&&lastRoute!=='/entrar')S.authTab='entrar';
  S.route=r;
  switch(r){
    case '/criar':viewEditor(app);break;
    case '/entrar':viewAuth(app);break;
    case '/nova-senha':viewNewPass(app);break;
    case '/conta':viewAccount(app);break;
    case '/admin':viewAdmin(app);break;
    default:S.route='/';viewShop(app);
  }
  updateNav();if(lastRoute!==S.route)window.scrollTo(0,0);lastRoute=S.route;
}
function setFoot(){
  const d=S.settings.whatsapp;
  $('#footLeft').innerHTML=esc(STORE.slogan)+' Por @'+esc(STORE.por);
  $('#footRight').innerHTML='<a href="https://instagram.com/'+esc(STORE.instagram)+'" target="_blank" rel="noopener">@'+esc(STORE.instagram)+'</a> · <a href="https://wa.me/'+esc(d)+'" target="_blank" rel="noopener">WhatsApp '+esc(fmtPhone(d))+'</a>';
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Não consegui carregar o Supabase.'));document.head.appendChild(s)})}

async function boot(){
  $('#brandFox').innerHTML=foxSVG('');
  try{const link=document.createElement('link');link.rel='icon';link.href='data:image/svg+xml,'+encodeURIComponent(foxSVG('').replace('<svg class=""','<svg xmlns="http://www.w3.org/2000/svg"'));document.head.appendChild(link)}catch(e){}
  S.settings=mergeSettings(null);setFoot();updateNav();
  $('#app').innerHTML='<div class="empty">'+foxSVG('').replace('<svg','<svg style="width:72px;height:auto"')+'<p>Carregando a loja...</p></div>';
  const cfg=window.HAMAB_CONFIG||{};let sb=null;
  try{
    if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY){
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
      sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    }
    S.api=sb?makeLiveApi(sb):makeLocalApi();S.demo=!sb;
    if(S.demo){const b=$('#banner');b.hidden=false;b.innerHTML='<div class="wrap"><span>Modo demonstração: tudo fica salvo só neste aparelho. Para o login seguro de verdade, conecte o Supabase (veja o LEIA-ME).</span></div>'}
    S.settings=mergeSettings(await S.api.getSettings());setFoot();
    S.products=await S.api.getProducts();
    S.user=await S.api.getUser();
    if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;go('#/nova-senha')}else setTimeout(refreshUser,0)});
  }catch(e){S.fatal='Não foi possível carregar a loja. '+errMsg(e)}
  window.addEventListener('hashchange',render);
  render();
}
boot();
})();
</script>
